<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LitLinks</title>
    <link rel="stylesheet" href="Cssik.css">
</head>
<body>
    <!-- Шапка сайта -->
    <header>
        <div class="logo">
            <a href="index.html" class="site-title">
                <svg class="logo-icon" viewBox="0 0 24 24">
                    <path d="M12 2L2 7v10l10 5 10-5V7L12 2z"/>
                </svg>
                <span class="site-name">LitLinks</span>
            </a>
        </div>
        <div class="modal" id="search-modal">
            <div class="modal-content search-modal-content">
                <button class="close-modal" id="close-search">×</button>
                <div class="search-bar-modal">
                    <input type="text" id="search-input-modal" placeholder="Поиск книг, авторов, пользователей...">
                        
                    </button>
                </div>
        
                <div class="search-tabs">
                    <button class="search-tab active" data-tab="books">Книги</button>
                    <button class="search-tab" data-tab="users">Пользователи</button>
                </div>
        
                <div class="search-results">
                    <div class="search-tab-content active" id="books-results">
                        <!-- Здесь будут результаты поиска по книгам -->
                        <div class="empty-results">Введите запрос для поиска книг</div>
                    </div>
        
                    <div class="search-tab-content" id="users-results">
                        <!-- Здесь будут результаты поиска по пользователям -->
                        <div class="empty-results">Введите запрос для поиска пользователей</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="search-bar">
            <button id="search-button" class="search-button">
                <span class="search-icon">🔍</span>
                <span class="search-text">Поиск</span>
            </button>
        </div>
        
        <div>
            <button id="theme-toggle" class="theme-toggle">
            </button>
        </div>
            <div class="menu-icon" id="menu-icon">☰</div>
        </div>
        <nav class="sidebar" id="sidebar">
            <button class="close-menu" id="close-menu">×</button>
            <ul>
                <!-- Кнопки для неавторизованных пользователей -->
                <li id="authLink">
                    <a href="#" id="open-login">Войти</a><a href="#" id="open-register">Регистрация</a>
                </li>
                <!-- Кнопки для авторизованных пользователей -->
                <li id="profile-link"><a href="profile.html" class="profile-button">👤 Профиль</a></li>
                <li id="bookmarks-link"><a href="bookmarks.html">📚 Закладки</a></li>
                <li id="notifications-link"><a href="notifications.html" class="notification-menu-item"> 🔔 Уведомления <span class="notification-counter"></span></a> </li>
                <!-- Кнопка выхода -->
                <li><button class="logout-icon" id="logout-icon">⎘ Выйти</button></li>
            </ul>
        </nav>
    </header>
    <!-- Модальное окно регистрации -->
    <div class="modal" id="register-modal">
        <div class="modal-content">
            <button class="close-modal" id="close-register">×</button>
            <h2>Регистрация</h2>
            <form id="register-form">
                <input type="text" id="register-login" placeholder="Логин" required>
                <input type="email" id="register-email" placeholder="Email" required>
                <input type="password" id="register-password" placeholder="Пароль" required>
                <input type="password" id="register-confirm-password" placeholder="Подтверждение пароля" required>
                <button type="submit">Зарегистрироваться</button>
            </form>
        </div>
    </div>

    <!-- Модальное окно входа -->
    <div class="modal" id="login-modal">
        <div class="modal-content">
            <button class="close-modal" id="close-login">×</button>
            <h2>Вход</h2>
            <form id="login-form">
                <input type="text" id="login-username" placeholder="Логин" required>
                <input type="password" id="login-password" placeholder="Пароль" required>
                <button type="submit">Войти</button>
            </form>
        </div>
    </div>

    <!-- Основной контент -->
    <main>
        <section class="book-list">
            <h2>Рекомендации</h2>
            <div class="books-grid" id="books"></div>
        </section>
    </main>


<!-- Чат -->
<div class="chat-widget">
    <button class="chat-toggle">💬</button>
    <div class="chat-container">
        <div class="chat-messages" id="chat-messages"></div>
        <div class="chat-input">
            <textarea id="message-input" placeholder="Напишите сообщение..."></textarea>
            <button id="send-message">Отправить</button>
        </div>
    </div>
</div>  
<script src="nightLight.js"></script>
  <script src="Javik.js"></script>
  <script src="Poisk.js"></script>
</body>
</html>
